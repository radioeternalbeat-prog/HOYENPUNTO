<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — HoyEnPunto</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8000; --primary-dark: #e67300; --primary-light: #ff9933;
            --primary-50: rgba(255,128,0,0.08); --primary-glow: 0 0 20px rgba(255,128,0,0.4);
            --accent: #e1ff00; --forest-950: #05140b; --forest-900: #0a2616;
            --surface: rgba(255,255,255,0.03); --surface-hover: rgba(255,255,255,0.06);
            --surface-border: rgba(255,255,255,0.07); --glass-bg: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.08); --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
            --text-muted: rgba(255,255,255,0.45); --text-dim: rgba(255,255,255,0.25);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --radius: 10px; --radius-lg: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--forest-950); background-image: radial-gradient(ellipse at 80% 10%, rgba(255,128,0,0.04) 0%, transparent 40%); color: var(--text-primary); min-height: 100vh; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
        .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
        .back-btn:hover { background: var(--surface-hover); border-color: var(--primary); color: var(--primary); }
        .header h1 { font-size: 1.5rem; font-weight: 800; }
        /* KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { padding: 20px; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: var(--radius-lg); border: 1px solid var(--glass-border); }
        .kpi-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .kpi-value { font-size: 1.8rem; font-weight: 800; }
        .kpi-value.primary { color: var(--primary); }
        .kpi-value.success { color: #34d399; }
        .kpi-value.volt { color: var(--accent); }
        .kpi-value.danger { color: #f87171; }
        .kpi-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
        /* Charts */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .chart-card { padding: 24px; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: var(--radius-lg); border: 1px solid var(--glass-border); }
        .chart-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 16px; }
        .chart-container { position: relative; height: 240px; }
        /* Top services */
        .top-service-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .top-service-item:last-child { border-bottom: none; }
        .top-service-icon { font-size: 1.3rem; width: 40px; height: 40px; border-radius: 10px; background: var(--primary-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .top-service-info { flex: 1; }
        .top-service-name { font-weight: 600; font-size: 0.85rem; }
        .top-service-count { font-size: 0.75rem; color: var(--text-muted); }
        .top-service-revenue { font-weight: 700; font-size: 0.9rem; color: var(--primary); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/dashboard/" class="back-btn">← Volver</a>
            <h1>📊 Analytics</h1>
        </div>

        <div id="content">
            <div class="empty-state"><p style="font-size:2rem;">⏳</p><p>Cargando analytics...</p></div>
        </div>
    </div>

    <!-- Chart.js + Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/db.js"></script>
    <script src="/js/utils.js"></script>

    <script>
        let business = null;

        (async () => {
            const user = await Auth.requireAuth('/login/');
            if (!user) return;
            const { data: biz } = await DB.businesses.getMine();
            if (!biz) { window.location.href = '/registro/'; return; }
            business = biz;
            if (!Access.requireAccess(biz)) return;
            await loadAnalytics();
        })();

        async function loadAnalytics() {
            const { data: a, error } = await DB.analytics.getBusinessAnalytics(business.id);
            if (error || !a) {
                document.getElementById('content').innerHTML = `<div class="empty-state"><p>No se pudieron cargar los analytics.</p><p style="font-size:0.8rem; margin-top:8px;">${error || ''}</p></div>`;
                return;
            }

            renderContent(a);
        }

        function renderContent(a) {
            const noShowColor = a.no_show_rate < 10 ? 'success' : a.no_show_rate < 20 ? 'volt' : 'danger';

            document.getElementById('content').innerHTML = `
                <!-- KPIs -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Ingresos Totales</div>
                        <div class="kpi-value primary">${Utils.formatPrice(a.total_revenue)}</div>
                        <div class="kpi-sub">Este mes: ${Utils.formatPrice(a.revenue_this_month)}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Reservas Totales</div>
                        <div class="kpi-value">${a.total_bookings}</div>
                        <div class="kpi-sub">${a.completed_bookings} completadas</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Tasa No-Show</div>
                        <div class="kpi-value ${noShowColor}">${a.no_show_rate}%</div>
                        <div class="kpi-sub">${a.no_show_bookings} ausencias</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Clientes</div>
                        <div class="kpi-value volt">${a.total_customers}</div>
                        <div class="kpi-sub">${a.returning_customers} recurrentes</div>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-title">📈 Reservas e Ingresos por Mes</div>
                        <div class="chart-container"><canvas id="monthChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">📅 Reservas por Día de la Semana</div>
                        <div class="chart-container"><canvas id="weekdayChart"></canvas></div>
                    </div>
                </div>

                <!-- Top services -->
                <div class="chart-card">
                    <div class="chart-title">🏆 Servicios Más Populares</div>
                    <div id="top-services"></div>
                </div>
            `;

            renderMonthChart(a.bookings_by_month || []);
            renderWeekdayChart(a.bookings_by_weekday || {});
            renderTopServices(a.top_services || []);
        }

        // Chart.js default styling
        Chart.defaults.color = 'rgba(255,255,255,0.5)';
        Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
        Chart.defaults.font.family = 'Inter, sans-serif';

        function renderMonthChart(data) {
            const monthNames = { '01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic' };
            const labels = data.map(d => monthNames[d.month.split('-')[1]] || d.month);
            const bookings = data.map(d => d.bookings);
            const revenue = data.map(d => d.revenue);

            new Chart(document.getElementById('monthChart'), {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['Sin datos'],
                    datasets: [
                        { label: 'Reservas', data: bookings, backgroundColor: '#ff8000', borderRadius: 6, yAxisID: 'y' },
                        { label: 'Ingresos', data: revenue, type: 'line', borderColor: '#e1ff00', backgroundColor: 'rgba(225,255,0,0.1)', borderWidth: 2, tension: 0.3, yAxisID: 'y1', pointBackgroundColor: '#e1ff00' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
                    scales: {
                        y: { beginAtZero: true, position: 'left', title: { display: true, text: 'Reservas', font: { size: 10 } } },
                        y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Ingresos $', font: { size: 10 } } }
                    }
                }
            });
        }

        function renderWeekdayChart(data) {
            const dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            const values = dayNames.map((_, i) => data[i] || 0);

            new Chart(document.getElementById('weekdayChart'), {
                type: 'radar',
                data: {
                    labels: dayNames,
                    datasets: [{
                        label: 'Reservas',
                        data: values,
                        backgroundColor: 'rgba(255,128,0,0.15)',
                        borderColor: '#ff8000',
                        borderWidth: 2,
                        pointBackgroundColor: '#ff8000'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { r: { beginAtZero: true, ticks: { display: false }, grid: { color: 'rgba(255,255,255,0.08)' }, angleLines: { color: 'rgba(255,255,255,0.08)' } } }
                }
            });
        }

        function renderTopServices(services) {
            const container = document.getElementById('top-services');
            if (!services.length) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem; padding:12px 0;">Aún no hay datos de servicios.</p>';
                return;
            }
            container.innerHTML = services.map(s => `
                <div class="top-service-item">
                    <div class="top-service-icon">${s.icon || '⭐'}</div>
                    <div class="top-service-info">
                        <div class="top-service-name">${s.name}</div>
                        <div class="top-service-count">${s.count} reservas</div>
                    </div>
                    <div class="top-service-revenue">${Utils.formatPrice(s.revenue)}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
