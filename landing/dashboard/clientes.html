<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — HoyEnPunto</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8000; --primary-dark: #e67300; --primary-light: #ff9933;
            --primary-50: rgba(255,128,0,0.08); --primary-glow: 0 0 20px rgba(255,128,0,0.4);
            --accent: #e1ff00; --forest-950: #05140b; --forest-900: #0a2616;
            --surface: rgba(255,255,255,0.03); --surface-hover: rgba(255,255,255,0.06);
            --surface-border: rgba(255,255,255,0.07); --glass-bg: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.08); --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
            --text-muted: rgba(255,255,255,0.45); --text-dim: rgba(255,255,255,0.25);
            --success: #10b981; --danger: #ef4444; --radius: 10px; --radius-lg: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--forest-950); background-image: radial-gradient(ellipse at 90% 10%, rgba(255,128,0,0.04) 0%, transparent 40%); color: var(--text-primary); min-height: 100vh; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.15s ease; }
        .back-btn:hover { background: var(--surface-hover); border-color: var(--primary); color: var(--primary); }
        .header h1 { font-size: 1.5rem; font-weight: 800; }
        .search-box { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); min-width: 250px; }
        .search-box input { flex: 1; border: none; background: transparent; outline: none; color: var(--text-primary); font-size: 0.85rem; font-family: inherit; }
        .search-box input::placeholder { color: var(--text-dim); }
        .stats-row { display: flex; gap: 16px; margin-bottom: 24px; }
        .stat-mini { padding: 14px 20px; background: var(--glass-bg); border-radius: var(--radius-lg); border: 1px solid var(--glass-border); flex: 1; }
        .stat-mini-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-mini-value { font-size: 1.3rem; font-weight: 800; }
        .client-list { display: flex; flex-direction: column; gap: 8px; }
        .client-card { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: var(--radius-lg); border: 1px solid var(--glass-border); transition: all 0.2s ease; cursor: pointer; }
        .client-card:hover { border-color: rgba(255,128,0,0.2); }
        .client-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-light), var(--primary)); display: flex; align-items: center; justify-content: center; color: var(--forest-950); font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
        .client-info { flex: 1; }
        .client-name { font-weight: 600; font-size: 0.95rem; }
        .client-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .client-stats { text-align: right; }
        .client-visits { font-weight: 700; font-size: 0.9rem; color: var(--primary); }
        .client-last { font-size: 0.7rem; color: var(--text-dim); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        @media (max-width: 600px) { .header { flex-direction: column; align-items: flex-start; } .search-box { min-width: 100%; } .stats-row { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="/dashboard/" class="back-btn">← Volver</a>
                <h1>👥 Clientes</h1>
            </div>
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search-input" placeholder="Buscar por nombre, email o teléfono..." oninput="searchClients(this.value)">
            </div>
        </div>

        <div class="stats-row" id="stats-row">
            <div class="stat-mini">
                <div class="stat-mini-label">Total Clientes</div>
                <div class="stat-mini-value" id="total-clients">—</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-label">Nuevos este Mes</div>
                <div class="stat-mini-value" id="new-clients">—</div>
            </div>
        </div>

        <div class="client-list" id="client-list">
            <div class="empty-state"><p>⏳ Cargando clientes...</p></div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/db.js"></script>
    <script src="/js/utils.js"></script>

    <script>
        let business = null;
        let allClients = [];

        (async () => {
            const user = await Auth.requireAuth('/login/');
            if (!user) return;
            const { data: biz } = await DB.businesses.getMine();
            if (!biz) { window.location.href = '/registro/'; return; }
            business = biz;
            if (!Access.requireAccess(biz)) return;
            await loadClients();
        })();

        async function loadClients(search = '') {
            const { data, count } = await DB.customers.getByBusiness(business.id, { limit: 100, search });
            allClients = data || [];
            document.getElementById('total-clients').textContent = count || allClients.length;
            renderClients();
        }

        function renderClients() {
            const container = document.getElementById('client-list');
            if (allClients.length === 0) {
                container.innerHTML = `<div class="empty-state"><p style="font-size:2rem;">👥</p><p>No hay clientes aún.</p><p style="font-size:0.8rem; margin-top:4px;">Los clientes aparecerán aquí cuando recibas tu primera reserva.</p></div>`;
                return;
            }
            container.innerHTML = allClients.map(c => `
                <div class="client-card">
                    <div class="client-avatar">${c.name.charAt(0).toUpperCase()}</div>
                    <div class="client-info">
                        <div class="client-name">${c.name}</div>
                        <div class="client-meta">${c.email || ''} ${c.phone ? '· ' + c.phone : ''}</div>
                    </div>
                    <div class="client-stats">
                        <div class="client-visits">${c.total_visits || 0} visitas</div>
                        <div class="client-last">${c.last_visit_at ? 'Última: ' + new Date(c.last_visit_at).toLocaleDateString('es-CL') : 'Sin visitas'}</div>
                    </div>
                </div>
            `).join('');
        }

        let searchTimeout;
        function searchClients(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadClients(query), 300);
        }
    </script>
</body>
</html>
