<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas — HoyEnPunto</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8000; --primary-dark: #e67300; --primary-light: #ff9933;
            --primary-50: rgba(255,128,0,0.08); --primary-glow: 0 0 20px rgba(255,128,0,0.4);
            --forest-950: #05140b; --forest-900: #0a2616;
            --surface: rgba(255,255,255,0.03); --surface-hover: rgba(255,255,255,0.06);
            --surface-border: rgba(255,255,255,0.07); --glass-bg: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.08); --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
            --text-muted: rgba(255,255,255,0.45); --text-dim: rgba(255,255,255,0.25);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --radius: 10px; --radius-lg: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--forest-950); background-image: radial-gradient(ellipse at 50% 0%, rgba(255,128,0,0.04) 0%, transparent 40%); color: var(--text-primary); min-height: 100vh; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.15s; }
        .back-btn:hover { background: var(--surface-hover); border-color: var(--primary); color: var(--primary); }
        .header h1 { font-size: 1.5rem; font-weight: 800; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text-muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background: var(--primary-50); border-color: var(--primary); color: var(--primary); }
        .booking-list { display: flex; flex-direction: column; gap: 8px; }
        .booking-card { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: var(--radius-lg); border: 1px solid var(--glass-border); transition: all 0.2s; }
        .booking-card:hover { border-color: rgba(255,128,0,0.2); }
        .booking-time { text-align: center; min-width: 55px; }
        .booking-time-date { font-size: 0.7rem; color: var(--text-dim); }
        .booking-time-hour { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
        .booking-divider { width: 3px; height: 40px; border-radius: 2px; }
        .booking-divider.confirmed { background: var(--primary); }
        .booking-divider.pending { background: var(--warning); }
        .booking-divider.completed { background: var(--success); }
        .booking-divider.cancelled { background: var(--danger); opacity: 0.5; }
        .booking-divider.no_show { background: var(--danger); }
        .booking-info { flex: 1; }
        .booking-client { font-weight: 600; font-size: 0.9rem; }
        .booking-service { font-size: 0.8rem; color: var(--text-muted); }
        .booking-status { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 100px; }
        .status-confirmed { background: rgba(255,128,0,0.1); color: var(--primary-light); border: 1px solid rgba(255,128,0,0.2); }
        .status-pending { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
        .status-completed { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .status-cancelled { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .status-no_show { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .booking-actions { display: flex; gap: 6px; }
        .action-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--surface-border); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all 0.15s; }
        .action-btn:hover { background: var(--surface-hover); border-color: var(--primary); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        @media (max-width: 600px) { .header { flex-direction: column; align-items: flex-start; } .booking-card { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="/dashboard/" class="back-btn">← Volver</a>
                <h1>📋 Reservas</h1>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="filterBookings('all', this)">Todas</button>
                <button class="filter-btn" onclick="filterBookings('confirmed', this)">Confirmadas</button>
                <button class="filter-btn" onclick="filterBookings('pending', this)">Pendientes</button>
                <button class="filter-btn" onclick="filterBookings('completed', this)">Completadas</button>
                <button class="filter-btn" onclick="filterBookings('cancelled', this)">Canceladas</button>
            </div>
        </div>

        <div class="booking-list" id="booking-list">
            <div class="empty-state"><p>⏳ Cargando reservas...</p></div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/db.js"></script>
    <script src="/js/utils.js"></script>

    <script>
        let business = null;
        let allBookings = [];
        let currentFilter = 'all';

        (async () => {
            const user = await Auth.requireAuth('/login/');
            if (!user) return;
            const { data: biz } = await DB.businesses.getMine();
            if (!biz) { window.location.href = '/registro/'; return; }
            business = biz;
            if (!Access.requireAccess(biz)) return;
            await loadBookings();
        })();

        async function loadBookings() {
            const opts = { limit: 100 };
            if (currentFilter !== 'all') opts.status = currentFilter;
            const { data } = await DB.bookings.getByBusiness(business.id, opts);
            allBookings = data || [];
            renderBookings();
        }

        function renderBookings() {
            const container = document.getElementById('booking-list');
            if (allBookings.length === 0) {
                container.innerHTML = `<div class="empty-state"><p style="font-size:2rem;">📋</p><p>No hay reservas ${currentFilter !== 'all' ? 'con este filtro' : 'aún'}.</p></div>`;
                return;
            }
            container.innerHTML = allBookings.map(b => {
                const startTime = new Date(b.start_time);
                const dateStr = startTime.toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
                const timeStr = startTime.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
                const statusLabels = { confirmed: 'Confirmada', pending: 'Pendiente', completed: 'Completada', cancelled: 'Cancelada', no_show: 'No-Show' };
                return `
                    <div class="booking-card">
                        <div class="booking-time">
                            <div class="booking-time-date">${dateStr}</div>
                            <div class="booking-time-hour">${timeStr}</div>
                        </div>
                        <div class="booking-divider ${b.status}"></div>
                        <div class="booking-info">
                            <div class="booking-client">${b.customer?.name || 'Cliente'}</div>
                            <div class="booking-service">${b.service?.name || 'Servicio'} · ${b.staff_member?.display_name || 'Staff'}</div>
                        </div>
                        <span class="booking-status status-${b.status}">${statusLabels[b.status] || b.status}</span>
                        <div class="booking-actions">
                            ${b.status === 'confirmed' ? `<button class="action-btn" onclick="updateStatus('${b.id}', 'completed')" title="Completar">✅</button>` : ''}
                            ${b.status === 'confirmed' || b.status === 'pending' ? `<button class="action-btn" onclick="updateStatus('${b.id}', 'cancelled')" title="Cancelar">❌</button>` : ''}
                            ${b.status === 'confirmed' ? `<button class="action-btn" onclick="updateStatus('${b.id}', 'no_show')" title="No-Show">🚫</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterBookings(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadBookings();
        }

        async function updateStatus(bookingId, newStatus) {
            const labels = { completed: 'completar', cancelled: 'cancelar', no_show: 'marcar como no-show' };
            if (!confirm(`¿Deseas ${labels[newStatus]} esta reserva?`)) return;

            const { error } = await DB.bookings.updateStatus(bookingId, newStatus);
            if (error) { Utils.toast('Error: ' + error, 'error'); return; }
            Utils.toast('Reserva actualizada ✓', 'success');
            await loadBookings();
        }
    </script>
</body>
</html>
